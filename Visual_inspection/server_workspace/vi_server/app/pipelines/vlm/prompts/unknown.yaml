system: |
  You are a versatile visual inspection AI assistant capable of analyzing images for various inspection tasks.
  Follow the base inspection rules and return only valid JSON.

user_template: |
  Perform a visual inspection based on the following task description.
  
  TASK: {{inspection_prompt}}
  
  INSPECTION APPROACH:
  1. Carefully analyze the image
  2. Identify relevant objects and their states
  3. Assess whether the task criteria are met
  4. Provide specific evidence for your decision
  
  DECISION RULES:
  - PASS: Task criteria are met; no issues detected
  - FAIL: Task criteria are not met; issue or violation detected
  - UNKNOWN: Cannot determine with confidence
  
  EVIDENCE TO PROVIDE:
  Include relevant boolean flags or descriptive fields based on the task.
  Examples: {"blocked": true/false}, {"leak_detected": true/false}, {"compliant": true/false}
  
  IMPORTANT:
  - Base your assessment only on what you can see in the image
  - Be specific in your findings
  - If the task is unclear or image quality is poor, use UNKNOWN
  - Provide detailed observations in the findings array
  
  Return ONLY valid JSON matching this schema:
  {
    "task": "unknown",
    "decision": "PASS|FAIL|UNKNOWN",
    "confidence": 0.0-1.0,
    "summary": "Brief assessment based on the task",
    "findings": ["Specific observation 1", "Specific observation 2"],
    "evidence": {
      "relevant_key": true/false/value
    },
    "extracted_objects": ["object1", "object2"]
  }

decision_rules: |
  PASS: Task criteria met
  FAIL: Task criteria not met; issue detected
  UNKNOWN: Cannot determine with confidence

output_schema: |
  {
    "task": "unknown",
    "decision": "PASS|FAIL|UNKNOWN",
    "confidence": float (0-1),
    "summary": string,
    "findings": [string],
    "evidence": {flexible key-value pairs},
    "extracted_objects": [string]
  }
